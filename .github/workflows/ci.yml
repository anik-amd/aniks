name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      persist:
        description: Commit the refreshed snapshot instead of only building it
        type: boolean
        default: false
  # The Now snapshot is refreshed weekly, then the same build ships.
  schedule:
    - cron: '17 5 * * 1'

# One run per ref; new pushes cancel older ones. Keeps Actions minutes down.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only the weekly refresh needs to write, and only to the snapshot.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Last.fm and Goodreads are read here, once a week, never during a build.
      # A manual dispatch refreshes too, which is how a branch preview can show
      # live data without committing anything.
      - name: Refresh the Now snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: node scripts/fetch-activity.mjs

      # No lockfile yet, so install rather than ci. Swap to `npm ci` once
      # package-lock.json is committed.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Test build output
        run: npm test

      # The page ships with a Pages Function; fail here, not at deploy time.
      - name: Build the edge function
        run: npx --yes wrangler@4 pages functions build functions --outdir .functions-build --compatibility-date=2026-11-01

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

      # Pushed with GITHUB_TOKEN on purpose: it must not start a second run.
      # This run has already built and tested the same bytes it is committing.
      # Never blocking: if main is protected, next week refreshes anyway.
      - name: Commit the refreshed snapshot
        if: github.event_name == 'schedule' || github.event.inputs.persist == 'true'
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain -- src/data/activity.json public/covers)" ]; then
            echo "snapshot unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/data/activity.json public/covers
          git commit -m 'chore: refresh now data'
          git push

  preview:
    name: Preview deploy
    # Every pull request gets its own Cloudflare preview URL. A manual dispatch
    # on a branch does the same, which is how the Now row can be checked against
    # live Last.fm data before a merge.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Check credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, skipping the preview deploy."
          fi

      - name: Deploy preview
        if: steps.creds.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          npx --yes wrangler@4 pages deploy dist \
            --project-name=aniks \
            --branch="$branch" \
            --compatibility-date=2026-11-01 \
            --commit-dirty=true | tee deploy.log
          url=$(grep -Eo 'https://[a-z0-9]+\.aniks\.pages\.dev' deploy.log | head -n1)
          alias_url="https://$(echo "$branch" | tr '/' '-' | tr '[:upper:]' '[:lower:]').aniks.pages.dev"
          {
            echo "### Preview ready"
            echo ""
            echo "- Deployment: ${url}"
            echo "- Branch alias: ${alias_url}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Production deploy
    # A manual dispatch on main is how the snapshot gets refreshed on demand:
    # same path as the weekly run, without waiting for Monday.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name=aniks \
            --branch=main \
            --compatibility-date=2026-11-01 \
            --commit-dirty=true

      - name: Smoke test production
        run: |
          # Pages edges can serve the previous build for a few seconds, so poll
          # with a cache-busting query until the new marker shows up.
          url="https://aniks.pages.dev/?smoke=${GITHUB_RUN_ID}"
          body=""
          for attempt in $(seq 1 12); do
            body=$(curl -fsS "$url" || true)
            if echo "$body" | grep -q 'data-theme-cycle' && echo "$body" | grep -q 'now:edge'; then
              echo "production serves the new build (attempt ${attempt})"
              break
            fi
            sleep 5
          done
          echo "$body" | grep -q 'data-theme-cycle' || { echo "production still serves an old build"; exit 1; }
          # now:edge is written by functions/index.ts, so this proves the edge ran.
          echo "$body" | grep -q 'now:edge' || { echo "the Now function did not run"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://aniks.pages.dev/not-a-real-page?smoke=${GITHUB_RUN_ID}")
          [ "$code" = "404" ] || { echo "unknown path returned ${code}, expected 404"; exit 1; }
          echo "production looks alive"
